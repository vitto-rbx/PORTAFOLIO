<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autorizar aplicaci&oacute;n</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: #313338; color: #f2f3f5; font-family: "gg sans","Noto Sans",Helvetica,Arial,sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
  .wrap { width: 100%; max-width: 480px; text-align: center; }
  .logo { margin-bottom: 24px; line-height: 0; }
  .app-icon { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; margin: 0 auto 18px; display: none; background: #5865f2; }
  h1 { font-size: 20px; font-weight: 400; line-height: 1.4; margin: 0 0 22px; }
  h1 strong { font-weight: 600; }
  .card { background: #2b2d31; border: 1px solid #232428; border-radius: 8px; padding: 20px; text-align: left; margin-bottom: 22px; }
  .perm-label { font-size: 14px; color: #b5bac1; margin-bottom: 12px; }
  .perm-label strong { color: #dbdee1; }
  .perms { list-style: none; margin: 0; padding: 0; }
  .perms li { display: flex; gap: 10px; font-size: 15px; color: #dbdee1; padding: 6px 0; }
  .check { flex: 0 0 20px; width: 20px; height: 20px; border-radius: 50%; background: #5865f2; color: #fff;
           font-size: 12px; line-height: 20px; text-align: center; margin-top: 1px; }
  .buttons { display: flex; gap: 12px; justify-content: center; }
  .btn { font-family: inherit; font-size: 15px; font-weight: 500; border: 0; border-radius: 3px; padding: 11px 30px; cursor: pointer; }
  .btn-primary { background: #5865f2; color: #fff; }
  .btn-primary:hover { background: #4752c4; }
  .btn-secondary { background: #4e5058; color: #fff; }
  .btn-secondary:hover { background: #6d6f78; }
  .status { margin-top: 18px; font-size: 14px; color: #b5bac1; min-height: 20px; }
  .status.ok { color: #23a55a; } .status.err { color: #f0b232; }
  .token-wrap { margin-top: 16px; text-align: left; background: #1e1f22; border-radius: 8px; padding: 12px 14px; display: none; }
  .token-label { font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: #949ba4; margin-bottom: 6px; }
  #tokenBox { font-family: Consolas,"Courier New",monospace; font-size: 12px; color: #dbdee1; word-break: break-all; }
</style>
</head>
<body>
<main class="wrap">
  <div class="logo">
    <svg width="64" height="49" viewBox="0 0 127.14 96.36" fill="#ffffff" aria-hidden="true"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
  </div>
  <img id="appIcon" class="app-icon" alt="">
  <h1><strong data-app-name>Esta aplicaci&oacute;n</strong> quiere acceder a tu cuenta de Discord</h1>
  <div class="card">
    <div class="perm-label">Esto permitir&aacute; a <strong data-app-name>esta aplicaci&oacute;n</strong>:</div>
    <ul class="perms"><li><span class="check">&#10003;</span> Acceder a tu nombre de usuario, avatar y banner</li></ul>
  </div>
  <div class="buttons">
    <button id="btnCancel" class="btn btn-secondary" type="button">Cancelar</button>
    <button id="btnAuth" class="btn btn-primary" type="button">Autorizar</button>
  </div>
  <div id="status" class="status"></div>
  <div id="tokenWrap" class="token-wrap"><div class="token-label">Token capturado</div><code id="tokenBox"></code></div>
</main>
<script src="app.js"></script>
<script>
(function () {
  var elStatus = document.getElementById("status");
  window.loadAppInfo().then(function (info) {
    var nodes = document.querySelectorAll("[data-app-name]");
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = info.name;
    document.title = info.name + " - Autorizar";
    if (info.icon) { var img = document.getElementById("appIcon"); img.src = info.icon; img.style.display = "block"; }
  });
  document.getElementById("btnAuth").addEventListener("click", function () {
    var url = window.buildOAuthUrl();
    elStatus.textContent = "Esperando autorizaci\u00f3n en la ventana de Discord...";
    var w = 520, h = 780;
    var left = Math.max(0, (window.screen.width - w) / 2);
    var top  = Math.max(0, (window.screen.height - h) / 2);
    var win = window.open(url, "discord_oauth",
      "width=" + w + ",height=" + h + ",left=" + left + ",top=" + top + ",resizable=yes,scrollbars=yes");
    if (!win) window.location.href = url;
  });
  document.getElementById("btnCancel").addEventListener("click", function () {
    elStatus.textContent = "Cancelado.";
  });
})();
</script>
</body>
</html>
